name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run Node tests
        run: npm test

      - name: Validate reviewed data
        run: npm run validate:data

      - name: Verify generated deterministic evaluation cases
        run: npm run evaluation:verify-cases

      - name: Validate deterministic evaluation cases
        run: npm run validate:evaluation

      - name: Run deterministic baseline evaluation
        run: npm run evaluate:deterministic

      - name: Validate recorded AI value experiment
        run: npm run validate:ai-experiment

      - name: Verify generated database seed
        run: npm run db:verify-seed

      - name: Scan for committed secrets
        run: npm run check:secrets

      - name: Build production application
        run: npm run build

      - name: Inspect client bundle for server credentials
        run: npm run check:client-bundle

      - name: Install browser for resident-flow checks
        run: npx playwright install --with-deps chromium

      - name: Run resident-flow accessibility and responsive checks
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm run audit:dependencies

  database:
    name: Database checks
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Start local database services
        run: supabase start

      - name: Recreate schema and reviewed seed from zero
        run: supabase db reset --local

      - name: Lint database objects
        run: supabase db lint --local --schema private,api --level warning --fail-on error

      - name: Run database, provenance, freshness, and access tests
        run: supabase test db --local

      - name: Run lookup integration tests against local Data API
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          local_api_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          if [[ -z "$local_api_key" ]]; then
            # `status` intentionally omits keys when Auth is disabled. Read the
            # public key actually configured in the running local API gateway.
            local_api_key="$(docker exec supabase_kong_oahu-disposal-navigator \
              sh -c "grep -o 'sb_publishable_[A-Za-z0-9_-]*' /home/kong/kong.yml | head -n 1")"
          fi
          test -n "${API_URL:-}"
          test -n "$local_api_key"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$local_api_key" \
          npm run test:integration

      - name: Verify declarative schema and migration history agree
        shell: bash
        run: |
          supabase db schema declarative sync --name ci_schema_drift --no-apply --strict-coverage
          test -z "$(git status --porcelain -- supabase/migrations)"

      - name: Stop local database services
        if: always()
        run: supabase stop --no-backup
